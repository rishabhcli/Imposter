name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  content-and-localization:
    name: Content and Localization
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate bundled content and localizations
        run: scripts/verify_content.sh

  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict

  build-and-test:
    name: Build and Unit Tests
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: |
          xcodebuild \
            -project Imposter.xcodeproj \
            -scheme Imposter-UnitTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -project Imposter.xcodeproj \
            -scheme Imposter-UnitTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            test

  ui-smoke:
    name: UI Smoke Test
    runs-on: macos-15
    needs: build-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run launch smoke test
        run: |
          xcodebuild \
            -project Imposter.xcodeproj \
            -scheme Imposter-UITests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:ImposterUITests/ImposterUITests/testLaunchShowsHomeScreen \
            test
